spring.application.name=inventory-api
spring.data.mongodb.uri=${INVENTORY_DB_URI}
spring.data.mongodb.auto-index-creation=true
server.port=${INVENTORY_SERVER_PORT}
jwt.secret=${INVENTORY_JWT_SECRET}
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL}
aws.s3.presign-expires-minutes=15
app.frontend.url=${INVENTORY_FRONTEND_URL}


